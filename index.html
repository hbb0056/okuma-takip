<style>
:root{--bg:#08080d;--bg-2:#0f0f16;--card:#14141d;--card-2:#1a1a26;--card-3:#202030;--border:#26263a;--text:#e8e8f0;--text-muted:#8a8aa0;--text-dim:#5a5a70;--primary:#8b5cf6;--primary-hover:#7c3aed;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--info:#06b6d4}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.summary-table th{background:var(--card-2);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;white-space:nowrap}
.summary-table tfoot td{border-top:2px solid var(--border);font-weight:700}
.summary-table tr:last-child td{border-bottom:none}
.summary-table td:first-child{text-align:left;font-weight:600}
.student-record-card{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.student-record-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.student-record-name{font-weight:700;font-size:15px}
.student-record-class{font-size:12px;color:var(--text-muted)}
.student-record-total{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;padding:6px 12px;background:rgba(139,92,246,.1);border-radius:8px;border:1px solid rgba(139,92,246,.2)}
details.record-kat{padding:0;border-top:1px solid var(--border);margin-top:4px}

.record-list{padding:4px 0 8px 18px}
.record-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;flex-wrap:wrap;border-top:1px dashed rgba(38,38,58,.6)}
.record-row:first-child{border-top:none}
.record-row-date{color:var(--text-muted);font-size:12px;min-width:80px}
.record-row-value{font-weight:700;min-width:32px;text-align:center}
.record-row-note{flex:1;color:var(--text);font-style:italic;font-size:12px;min-width:100px;word-break:break-word}
.record-row-actions{display:flex;gap:4px;margin-left:auto}
.empty{text-align:center;padding:30px 20px;color:var(--text-dim);font-size:14px;border:1px dashed var(--border);border-radius:12px}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.header-title{display:flex;align-items:center;gap:10px}
.icon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:rgba(139,92,246,.12);font-size:20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px;animation:fadeIn .15s ease;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:slideUp .2s ease;margin:auto}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:12px}
.modal-body{color:var(--text);margin-bottom:20px;line-height:1.6;font-size:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:12px 22px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:9999;font-size:14px;max-width:90%;text-align:center;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.info{border-color:var(--info);color:var(--info)}
.cat-checkbox-group{display:grid;gap:8px;margin-top:4px}
.cat-checkbox{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;text-transform:none;letter-spacing:0;font-weight:500;font-size:14px;color:var(--text);margin-bottom:0}
.cat-checkbox:hover{border-color:var(--primary)}
.cat-checkbox input[type=checkbox]{width:18px;height:18px;min-width:18px;padding:0;margin:0;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.cat-checkbox.checked{border-color:var(--primary);background:rgba(139,92,246,.08)}
.cat-checkbox.checked span{color:var(--primary);font-weight:600}
.category-pill{display:inline-block;padding:3px 9px;margin:2px 4px 2px 0;background:rgba(139,92,246,.12);color:var(--primary);border-radius:20px;font-size:11px;font-weight:600;border:1px solid rgba(139,92,246,.2)}
.locked-field{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg);border:1.5px solid var(--primary);border-radius:10px;font-size:14px;font-weight:500;color:var(--text)}
.locked-field::after{content:'🔒';margin-left:auto;opacity:.6}
@media (max-width:600px){body{padding:12px}.card{padding:18px}.role-select{grid-template-columns:1fr}h1{font-size:20px}.tab{font-size:11px;padding:8px 8px;min-width:60px}.note-input{max-width:none}.category-label{min-width:100%}}
</style>

<body>
<div class="container" id="app"></div>
<script>
/* ==================== SUPABASE ==================== */
const SUPABASE_URL = 'https://fknarziykrmnbmhhqvdn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_r49ROlqhwVcxPQMlGivpcg_vLimZU4T';

const ADMIN_PASSWORD = 'HH5680';
const LS_CACHE_KEY = 'takipAppCache_v2';
const SESSION_KEY = 'takipAppSession';
const NOTE_MAX = 200;

/* ==================== DB ==================== */
function defaultDB(){
  return{
    classes:[],codes:[],requests:[],records:[],
    categories:[
      {key:'okuma',label:'📚 Kitap Okuma',archived:false,order:0},
      {key:'odev',label:'📝 Ödev',archived:false,order:1},
      {key:'performans',label:'⭐ Performans',archived:false,order:2}
    ]
  };
}
function normalizeDB(data){
  const d=data||{};
  return{
    classes:Array.isArray(d.classes)?d.classes:[],
    codes:Array.isArray(d.codes)?d.codes:[],
    requests:Array.isArray(d.requests)?d.requests:[],
    records:Array.isArray(d.records)?d.records:[],
    categories:Array.isArray(d.categories)&&d.categories.length?d.categories:defaultDB().categories
  };
}
function loadCache(){try{const raw=localStorage.getItem(LS_CACHE_KEY);if(raw)return normalizeDB(JSON.parse(raw));}catch(e){}return defaultDB();}
function saveCache(){try{localStorage.setItem(LS_CACHE_KEY,JSON.stringify(DB));}catch(e){}}

/* ==================== STATE ==================== */
let DB = loadCache();
let supabaseReady = false;
let supabaseClient = null;
let saveInFlight = false;
let pendingSave = false;

let state = {
  view:'home',
  adminTab:'classes',
  editingClassId:null,
  recordFilter:'',
  student:{code:'',codeId:'',classId:'',selectedCategories:[],reSelectMode:false},
  pendingNotes:{}
};

/* ==================== SUPABASE INIT ==================== */
async function initSupabase(){
  if(!SUPABASE_URL.startsWith('http')||!SUPABASE_ANON_KEY||SUPABASE_ANON_KEY.length<20){
    console.warn('Supabase yapılandırılmamış');
    return;
  }
  try{
    const {createClient} = supabase;
    supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data,error} = await supabaseClient.from('app_data').select('data').eq('id',1).single();
    if(error){console.error('Supabase yükleme hatası:',error);toast('Bulut verisi yüklenemedi (yerel önbellek kullanılıyor)','error');return;}
    if(data&&data.data){DB=normalizeDB(data.data);saveCache();render();}
    supabaseClient.channel('app_data_rt')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_data'},(payload)=>{
        if(payload.new&&payload.new.data){DB=normalizeDB(payload.new.data);saveCache();render();}
      })
      .subscribe((status)=>{if(status==='SUBSCRIBED'){supabaseReady=true;render();}});
    supabaseReady=true;render();
  }catch(e){
    console.error('Supabase başlatma hatası:',e);
    toast('Bulut bağlantısı kurulamadı','error');
  }
}

function saveDB(){
  saveCache();
  if(!supabaseClient)return;
  if(saveInFlight){pendingSave=true;return;}
  saveInFlight=true;
  (async()=>{
    try{
      const {error}=await supabaseClient.from('app_data').update({data:DB,updated_at:new Date().toISOString()}).eq('id',1);
      if(error)throw error;
    }catch(e){
      console.error('Supabase kayıt hatası:',e);
      toast('Bulut kaydı başarısız (yerel önbelleğe kaydedildi)','error');
    }finally{
      saveInFlight=false;
      if(pendingSave){pendingSave=false;saveDB();}
    }
  })();
}

/* ==================== YARDIMCILAR ==================== */
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDate(d){
  if(!d)return'';
  if(typeof d==='string'){const p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
function fmtNum(n){return n>0?'+'+n:n<0?String(n):'0';}

function activeCategories(){return DB.categories.filter(c=>!c.archived).sort((a,b)=>(a.order||0)-(b.order||0));}
function allCategoriesSorted(){return [...DB.categories].sort((a,b)=>(a.order||0)-(b.order||0));}
function findCategory(key){return DB.categories.find(c=>c.key===key);}
function generateCategoryKey(label){
  let base=String(label).toLowerCase()
    .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z0-9]/g,'');
  if(!base)base='kategori';
  let key=base,n=1;
  while(DB.categories.some(c=>c.key===key)){key=base+n;n++;}
  return key;
}

function getCurrentRequest(){
  if(!state.student.codeId||!state.student.classId)return null;
  return DB.requests.find(r=>r.codeId===state.student.codeId&&r.classId===state.student.classId)||null;
}
function getAllowedCategoriesForRequest(req){
  if(!req)return [];
  if(Array.isArray(req.categoryKeys)&&req.categoryKeys.length>0)return req.categoryKeys;
  return null; // eski talepler için null = tümü
}

/* ==================== TOAST / MODAL ==================== */
function toast(message,type='info'){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .3s';
    el.style.opacity='0';
    setTimeout(()=>{if(el.parentNode)document.body.removeChild(el);},320);
  },2400);
}

function showConfirm(message,onConfirm){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal"><div class="modal-body" style="white-space:pre-line;">${esc(message)}</div><div class="modal-actions"><button class="btn btn-ghost" data-modal="cancel">İptal</button><button class="btn btn-primary" data-modal="ok">Tamam</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{
    if(e.target===overlay||e.target.dataset.modal==='cancel'){
      if(overlay.parentNode)document.body.removeChild(overlay);
    }else if(e.target.dataset.modal==='ok'){
      if(overlay.parentNode)document.body.removeChild(overlay);
      onConfirm();
    }
  });
}

/* ==================== SESSION ==================== */
function saveSession(){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(state.student));}catch(e){}}
function clearSession(){try{sessionStorage.removeItem(SESSION_KEY);}catch(e){}}

(function restoreSession(){
  try{
    const raw=sessionStorage.getItem(SESSION_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(data.code&&data.codeId){
      const c=DB.codes.find(x=>x.id===data.codeId&&x.active);
      if(c){
        state.student={
          code:data.code,
          codeId:data.codeId,
          classId:data.classId||'',
          selectedCategories:data.selectedCategories||[],
          reSelectMode:false
        };
        state.view='student';
      }
    }
  }catch(e){}
})();

/* ==================== RENDER ==================== */
function render(){
  const app=document.getElementById('app');
  if(!app)return;
  try{
    switch(state.view){
      case 'home':app.innerHTML=viewHome();break;
      case 'adminLogin':app.innerHTML=viewAdminLogin();break;
      case 'admin':app.innerHTML=viewAdmin();break;
      case 'classDetail':app.innerHTML=viewClassDetail();break;
      case 'student':app.innerHTML=viewStudent();break;
      default:app.innerHTML=viewHome();
    }
  }catch(e){
    console.error('Render hatası:',e);
    app.innerHTML=`<div class="card"><div class="alert alert-danger">Hata: ${esc(e.message)}</div><button class="btn btn-primary btn-block" data-action="go-home">Ana Sayfa</button></div>`;
  }
}

function syncIndicator(){
  if(!supabaseClient)return '<span style="font-size:11px;color:var(--text-dim);">🔒 Yerel mod</span>';
  if(supabaseReady)return '<span style="font-size:11px;color:var(--success);">☁️ Bulut bağlı</span>';
  return '<span style="font-size:11px;color:var(--warning);">⏳ Bağlanıyor...</span>';

function renderSummaryTable(classId){
  const cls=DB.classes.find(c=>c.id===classId);
  if(!cls||cls.students.length===0)return '';
  const usedKeys=new Set(DB.records.filter(r=>r.classId===classId).map(r=>r.category));
  const cats=DB.categories.filter(c=>!c.archived||usedKeys.has(c.key)).sort((a,b)=>(a.order||0)-(b.order||0));
  if(cats.length===0)return '';

  const totals={};
  cls.students.forEach(s=>{totals[s.id]={};cats.forEach(c=>totals[s.id][c.key]=0);});
  let classGrand=0;
  DB.records.filter(r=>r.classId===classId).forEach(r=>{
    if(totals[r.studentId]&&totals[r.studentId][r.category]!==undefined){
      totals[r.studentId][r.category]+=r.value;
      classGrand+=r.value;
    }
  });

  const headerCells=cats.map(c=>{
    const mark=c.archived?' <span style="font-size:9px;color:var(--text-dim);">(arşiv)</span>':'';
    return `<th>${esc(c.label)}${mark}</th>`;
  }).join('');

  const rows=cls.students.map(s=>{
    const t=totals[s.id];
    const cell=v=>`<td class="${v>0?'score-pos':v<0?'score-neg':'score-zero'}">${fmtNum(v)}</td>`;
    const rowTotal=cats.reduce((sum,c)=>sum+(t[c.key]||0),0);
    const rc=rowTotal>0?'score-pos':rowTotal<0?'score-neg':'score-zero';
    return `<tr><td>${esc(s.name)}</td>${cats.map(c=>cell(t[c.key]||0)).join('')}<td style="font-weight:700;border-left:2px solid var(--border);" class="${rc}">${fmtNum(rowTotal)}</td></tr>`;
  }).join('');

  const footCells=cats.map(c=>{
    const s=cls.students.reduce((sum,st)=>sum+(totals[st.id][c.key]||0),0);
    return `<td class="${s>0?'score-pos':s<0?'score-neg':'score-zero'}">${fmtNum(s)}</td>`;
  }).join('');

  const grandColor=classGrand>0?'score-pos':classGrand<0?'score-neg':'score-zero';
  return `<h3>${esc(cls.name)} — Tüm Zamanlar Özet</h3>
    <div class="table-scroll"><table class="summary-table">
      <thead><tr><th style="text-align:left;">Öğrenci</th>${headerCells}<th style="border-left:2px solid var(--border);">Toplam</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>SINIF TOPLAMI</td>${footCells}<td style="border-left:2px solid var(--border);" class="${grandColor}">${fmtNum(classGrand)}</td></tr></tfoot>
    </table></div>`;
}

function renderStudentRecordCard(g){
  const{cls,stu,records}=g;
  const stuName=stu?stu.name:'Silinmiş öğrenci';
  const clsName=cls?cls.name:'';

  const byCat={};
  records.forEach(r=>{if(!byCat[r.category])byCat[r.category]=[];byCat[r.category].push(r);});
  const catKeys=Object.keys(byCat).sort((a,b)=>{
    const ca=findCategory(a),cb=findCategory(b);
    const oa=ca?(ca.order||0):999;
    const ob=cb?(cb.order||0):999;
    return oa-ob;
  });

  let grandPlus=0,grandMinus=0;
  const catHtml=catKeys.map(key=>{
    const cat=findCategory(key);
    const catLabel=cat?cat.label:(key||'Silinmiş kategori');
    const archived=cat&&cat.archived?' <span class="badge badge-archived" style="font-size:9px;">arşiv</span>':'';
    const recs=byCat[key].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
    let plus=0,minus=0;
    recs.forEach(r=>{if(r.value>0)plus+=r.value;else if(r.value<0)minus+=r.value;});
    grandPlus+=plus;grandMinus+=minus;
    const total=plus+minus;
    const totalColor=total>0?'score-pos':total<0?'score-neg':'score-zero';

    const recRows=recs.map(r=>{
      const vc=r.value>0?'score-pos':r.value<0?'score-neg':'score-zero';
      return `<div class="record-row">
        <span class="record-row-date">${formatDate(r.date)}</span>
        <span class="record-row-value ${vc}">${fmtNum(r.value)}</span>
        <span class="record-row-note">${r.note?'💬 '+esc(r.note):'<span style="color:var(--text-dim);">—</span>'}</span>
        <span class="record-row-actions">
          <button class="btn btn-warning btn-sm" data-action="edit-record" data-id="${r.id}">Değiştir</button>
          <button class="btn btn-danger btn-sm" data-action="del-record" data-id="${r.id}">Sil</button>
        </span>
      </div>`;
    }).join('');

    return `<details class="record-kat">
      <summary>
        <strong>${esc(catLabel)}</strong>${archived}
        <span style="font-size:12px;color:var(--text-muted);margin-left:6px;">
          <span class="score-pos">+${plus}</span>
          <span class="score-neg">−${Math.abs(minus)}</span>
          <span class="${totalColor}" style="font-weight:700;">= ${fmtNum(total)}</span>
        </span>
        <span style="font-size:11px;color:var(--text-dim);margin-left:6px;">(${recs.length} kayıt)</span>
      </summary>
      <div class="record-list">${recRows}</div>
    </details>`;
  }).join('');

  const grandTotal=grandPlus+grandMinus;
  const grandColor=grandTotal>0?'score-pos':grandTotal<0?'score-neg':'score-zero';
  return `<div class="student-record-card">
    <div class="student-record-header">
      <div>
        <div class="student-record-name">${esc(stuName)}</div>
        ${clsName?`<div class="student-record-class">${esc(clsName)}</div>`:''}
      </div>
      <div class="student-record-total">
        <span class="score-pos">+${grandPlus}</span>
        <span class="score-neg">−${Math.abs(grandMinus)}</span>
        <span class="${grandColor}">= ${fmtNum(grandTotal)}</span>
      </div>
    </div>
    ${catHtml||'<div class="empty" style="padding:14px;font-size:13px;">Kayıt yok</div>'}
  </div>`;
}

function viewStudent(){
  // Kodun aktifliğini doğrula
  if(state.student.code){
    const codeObj=DB.codes.find(c=>c.id===state.student.codeId&&c.active);
    if(!codeObj){
      state.student={code:'',codeId:'',classId:'',selectedCategories:[],reSelectMode:false};
      clearSession();
      return `<div class="card">
        <div class="alert alert-danger">Kodunuz geçersiz kılınmış. Lütfen yöneticiden yeni kod isteyin.</div>
        <button class="btn btn-primary btn-block" data-action="std-logout">Çıkış Yap</button>
        <button class="btn btn-ghost btn-block mt" data-action="go-home">Ana Sayfa</button>
      </div>`;
    }
    // Sınıf bağlantısını uygula
    if(codeObj.boundClassId){
      const cls=DB.classes.find(cl=>cl.id===codeObj.boundClassId);
      if(!cls){
        codeObj.boundClassId=null;saveDB();
        state.student.classId='';saveSession();
      }else{
        state.student.classId=codeObj.boundClassId;
      }
    }
  }

  // Sıralı akış
  if(!state.student.code) return studentCodeEntry();
  if(state.student.reSelectMode) return studentClassSelect();

  const req=getCurrentRequest();

  // Sınıf veya talep yoksa seçim ekranı
  if(!state.student.classId || !req) return studentClassSelect();

  // Eski kategorisiz talepler için seçim ekranına dön
  const hasCats = Array.isArray(req.categoryKeys) && req.categoryKeys.length > 0;
  if(!hasCats) return studentClassSelect();

  if(req.status==='pending') return studentWaiting();
  if(req.status==='rejected') return studentRejected();
  return studentRecordView();
}

    ?`<div class="form-group"><label>Sınıfınız (kilitli)</label><div class="locked-field">🏫 ${esc(boundClass.name)}</div></div>`
    :`<div class="form-group"><label>Sınıf Seçin</label><select id="stdClass">${DB.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>`;

  const selected=state.student.selectedCategories||[];

function studentRecordView(){
  const cls=DB.classes.find(c=>c.id===state.student.classId);
  if(!cls)return `<div class="card"><div class="alert alert-danger">Sınıf bulunamadı</div><button class="btn btn-primary btn-block" data-action="std-logout">Çıkış Yap</button></div>`;

  const date=today();
  const req=getCurrentRequest();
  const allowed=getAllowedCategoriesForRequest(req);
  const allActive=activeCategories();
  const cats=allowed?allActive.filter(c=>allowed.includes(c.key)):allActive;

  const allowedLabels=cats.map(c=>`<span class="category-pill">${esc(c.label)}</span>`).join('');

  const studentsHtml=cls.students.length===0
    ?'<div class="empty">Bu sınıfta öğrenci yok</div>'
    :cls.students.map(s=>{
      const blocks=cats.length===0
        ?'<div class="empty" style="padding:14px;font-size:13px;">Onaylı kategori yok</div>'
        :cats.map(cat=>{
          const rec=DB.records.find(r=>r.classId===cls.id&&r.studentId===s.id&&r.category===cat.key&&r.date===date);
          const noteKey=s.id+'|'+cat.key;

          if(rec){
            const vc=rec.value>0?'score-pos':rec.value<0?'score-neg':'score-zero';
            const noteHtml=rec.note?`<div class="record-note">${esc(rec.note)}</div>`:'';
            return `<div class="category-block">
              <div class="category-row">
                <div class="category-label">${esc(cat.label)}</div>
                <span class="score-display ${vc}">${fmtNum(rec.value)}</span>

          }

          const noteVal=state.pendingNotes[noteKey]||'';
          return `<div class="category-block">
            <div class="category-row">
              <div class="category-label">${esc(cat.label)}</div>
              <input class="note-input" data-note-key="${noteKey}" value="${esc(noteVal)}" placeholder="Açıklama (isteğe bağlı)..." maxlength="${NOTE_MAX}">
              <button class="score-btn plus" data-action="add-record-from-row" data-id="${s.id}" data-id2="${esc(cat.key)}" data-value="1" title="+1">+</button>
              <button class="score-btn minus" data-action="add-record-from-row" data-id="${s.id}" data-id2="${esc(cat.key)}" data-value="-1" title="-1">−</button>
            </div>
          </div>`;
        }).join('');
      return `<div class="student-card"><div class="student-name">${esc(s.name)}</div>${blocks}</div>`;
    }).join('');

  return `<div class="card">
    <div class="header-bar">
      <div class="header-title">
        <div class="icon">🎓</div>
        <div>
          <h1 style="font-size:19px;">${esc(cls.name)}</h1>
          <div class="subtitle" style="margin:2px 0 0;font-size:12px;">
            📅 Bugün: <strong>${formatDate(date)}</strong> • Kod: <strong>${esc(state.student.code)}</strong>
          </div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="std-logout">Çıkış Yap</button>
    </div>
    ${allowedLabels?`<div style="margin-bottom:12px;font-size:12px;color:var(--text-muted);">Onaylı kategorileriniz: ${allowedLabels}</div>`:''}
    <div class="alert alert-info">⚠️ Her gün için <strong>birer</strong> kayıt girilir. İsterseniz açıklama yazıp + veya − butonuna basın.</div>
    ${studentsHtml}
  </div>`;
}

/* ==================== EVENT DELEGATION ==================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  e.preventDefault();
  handleAction(el.dataset.action,el.dataset.id||'',el.dataset.id2||'',el.dataset.value||'');
});

document.addEventListener('change',e=>{
  if(e.target.matches('[data-action="filter-record"]')){
    state.recordFilter=e.target.value;
    render();
  }else if(e.target.matches('[data-cat-key]')){
    if(!state.student.selectedCategories)state.student.selectedCategories=[];
    const key=e.target.dataset.catKey;
    if(e.target.checked){
      if(!state.student.selectedCategories.includes(key))state.student.selectedCategories.push(key);
    }else{
      state.student.selectedCategories=state.student.selectedCategories.filter(k=>k!==key);
    }
    const parent=e.target.closest('.cat-checkbox');
    if(parent){
      if(e.target.checked)parent.classList.add('checked');
      else parent.classList.remove('checked');
    }
  }
});

document.addEventListener('input',e=>{
  if(e.target.matches('.note-input')){
    const key=e.target.dataset.noteKey;
    if(key)state.pendingNotes[key]=e.target.value;
  }
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target;
  if(el.id==='adminPass'){e.preventDefault();tryAdminLogin();}
  else if(el.id==='newClassName'){e.preventDefault();addClass();}
  else if(el.id==='newStudentName'){e.preventDefault();addStudent(state.editingClassId);}
  else if(el.id==='stdCode'){e.preventDefault();tryStudentLogin();}
  else if(el.id==='newCategoryLabel'){e.preventDefault();addCategory();}
});

function handleAction(action,id,id2,value){
  switch(action){
    case 'go-home':state.view='home';state.editingClassId=null;render();break;
    case 'go-admin':state.view='adminLogin';render();break;
    case 'go-student':state.view='student';render();break;
    case 'admin-logout':state.view='home';state.adminTab='classes';render();break;
    case 'back-to-classes':state.view='admin';state.adminTab='classes';state.editingClassId=null;render();break;
    case 'admin-tab':state.adminTab=id;state.recordFilter='';render();break;
    case 'admin-login':tryAdminLogin();break;
    case 'std-login':tryStudentLogin();break;
    case 'add-class':addClass();break;
    case 'delete-class':deleteClass(id);break;
    case 'open-class':state.editingClassId=id;state.view='classDetail';render();break;
    case 'add-student':addStudent(id);break;
    case 'remove-student':removeStudent(id2,id);break;
    case 'add-category':addCategory();break;
    case 'edit-category':editCategoryModal(id);break;
    case 'toggle-category':toggleCategory(id);break;
    case 'delete-category':deleteCategory(id);break;
    case 'generate-code':generateCode();break;
    case 'toggle-code':toggleCode(id);break;
    case 'delete-code':deleteCode(id);break;
    case 'copy-code':copyCode(value);break;
    case 'unbind-code':unbindCode(id);break;
    case 'approve-req':approveRequest(id);break;
    case 'reject-req':rejectRequest(id);break;
    case 'delete-req':deleteRequest(id);break;
    case 'edit-record':adminEditRecord(id);break;
    case 'del-record':adminDeleteRecord(id);break;
    case 'std-select-class':selectStudentClass();break;
    case 'std-re-request':reRequest();break;
    case 'std-refresh':render();break;
    case 'std-reset':
      state.student={code:'',codeId:'',classId:'',selectedCategories:[],reSelectMode:false};
      state.pendingNotes={};
      clearSession();render();
      break;
    case 'std-logout':
      state.student={code:'',codeId:'',classId:'',selectedCategories:[],reSelectMode:false};
      state.pendingNotes={};
      state.view='home';
      clearSession();render();
      break;
    case 'add-record-from-row':{
      const noteKey=id+'|'+id2;
      const note=(state.pendingNotes[noteKey]||'').trim().slice(0,NOTE_MAX);
      delete state.pendingNotes[noteKey];
      saveRecord(id,id2,parseInt(value,10),note);
      break;
    }
  }
}

/* ==================== İŞ MANTIĞI ==================== */
function tryAdminLogin(){
  const input=document.getElementById('adminPass');
  if(!input)return;
  if(input.value===ADMIN_PASSWORD){
    state.view='admin';
    state.adminTab='classes';
    render();
  }else{
    toast('Hatalı şifre','error');
    input.value='';input.focus();
  }
}

function tryStudentLogin(){
  const input=document.getElementById('stdCode');
  if(!input)return;
  const code=input.value.trim().toUpperCase();
  if(!code){toast('Kod girin','error');return;}
  const c=DB.codes.find(x=>x.code===code&&x.active);
  if(!c){toast('Geçersiz veya pasif kod','error');return;}

  let boundClassId='';
  if(c.boundClassId){
    const cls=DB.classes.find(cl=>cl.id===c.boundClassId);
    if(cls)boundClassId=cls.id;
    else{c.boundClassId=null;saveDB();}
  }
  state.student={code:c.code,codeId:c.id,classId:boundClassId,selectedCategories:[],reSelectMode:false};
  saveSession();
  render();
}

function selectStudentClass(){
  const codeObj=DB.codes.find(x=>x.id===state.student.codeId);
  if(!codeObj){toast('Kod bulunamadı','error');return;}

  // Sınıf seçimi (kilitliyse koddan)
  let selectedClassId=codeObj.boundClassId||'';
  if(!selectedClassId){
    const sel=document.getElementById('stdClass');
    if(!sel||!sel.value){toast('Sınıf seçin','error');return;}
    selectedClassId=sel.value;
  }

  // Kategori seçimi
  const catCheckboxes=document.querySelectorAll('[data-cat-key]');
  const selectedCategories=[];
  catCheckboxes.forEach(cb=>{if(cb.checked)selectedCategories.push(cb.dataset.catKey);});
  if(selectedCategories.length===0){toast('En az 1 kategori seçin','error');return;}

  // Kod → sınıf kilidi
  if(!codeObj.boundClassId)codeObj.boundClassId=selectedClassId;

  state.student.classId=selectedClassId;
  state.student.reSelectMode=false;

  // Talep oluştur veya güncelle
  const existing=DB.requests.find(r=>r.codeId===state.student.codeId&&r.classId===state.student.classId);
  if(existing){
    existing.categoryKeys=selectedCategories;
    existing.status='pending';
    existing.createdAt=Date.now();
    existing.codeValue=state.student.code;
  }else{
    DB.requests.push({
      id:uid(),
      codeId:state.student.codeId,
      codeValue:state.student.code,
      classId:state.student.classId,
      categoryKeys:selectedCategories,
      status:'pending',
      createdAt:Date.now()
    });
  }
  saveDB();saveSession();render();
  toast('Talep gönderildi','success');
}

function reRequest(){
  state.student.reSelectMode=true;
  state.student.selectedCategories=[];
  render();
}

/* ==================== SINIF İŞLEMLERİ ==================== */
function addClass(){
  const input=document.getElementById('newClassName');
  if(!input)return;
  const name=input.value.trim();
  if(!name){toast('Sınıf adı girin','error');input.focus();return;}
  DB.classes.push({id:uid(),name,students:[]});
  saveDB();render();
}

function deleteClass(id){
  const cls=DB.classes.find(c=>c.id===id);
  if(!cls)return;
  showConfirm(`"${cls.name}" sınıfı ve tüm kayıtları silinecek.\n\nOnaylıyor musunuz?`,()=>{
    DB.classes=DB.classes.filter(c=>c.id!==id);
    DB.codes.forEach(c=>{if(c.boundClassId===id)c.boundClassId=null;});
    DB.records=DB.records.filter(r=>r.classId!==id);
    DB.requests=DB.requests.filter(r=>r.classId!==id);
    saveDB();render();
    toast('Sınıf silindi','success');
  });
}

function addStudent(classId){
  const input=document.getElementById('newStudentName');
  if(!input)return;
  const name=input.value.trim();
  if(!name){toast('Öğrenci adı girin','error');input.focus();return;}
  const cls=DB.classes.find(c=>c.id===classId);
  if(!cls){toast('Sınıf bulunamadı','error');return;}
  if(!Array.isArray(cls.students))cls.students=[];
  cls.students.push({id:uid(),name});
  saveDB();
  state.view='classDetail';
  state.editingClassId=classId;
  render();
}

function removeStudent(classId,studentId){
  const cls=DB.classes.find(c=>c.id===classId);
  if(!cls)return;
  const stu=cls.students.find(s=>s.id===studentId);
  if(!stu)return;
  showConfirm(`"${stu.name}" silinsin mi?\n\nKayıtları da silinecek.`,()=>{
    cls.students=cls.students.filter(s=>s.id!==studentId);
    DB.records=DB.records.filter(r=>!(r.classId===classId&&r.studentId===studentId));
    saveDB();render();
    toast('Öğrenci silindi','success');
  });
}

/* ==================== KATEGORİ İŞLEMLERİ ==================== */
function addCategory(){
  const input=document.getElementById('newCategoryLabel');
  if(!input)return;
  const label=input.value.trim();
  if(!label){toast('Kategori adı girin','error');input.focus();return;}
  const key=generateCategoryKey(label);
  const maxOrder=DB.categories.reduce((m,c)=>Math.max(m,c.order||0),-1);
  DB.categories.push({key,label,archived:false,order:maxOrder+1});
  saveDB();render();
  toast('Kategori eklendi: '+label,'success');
}

function editCategoryModal(key){
  const cat=findCategory(key);
  if(!cat)return;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal">
    <div class="modal-title">Kategori Düzenle</div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:0;">
        <label>Kategori Adı</label>
        <input id="editCatLabel" value="${esc(cat.label)}" autocomplete="off">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-modal="cancel">İptal</button>
      <button class="btn btn-primary" data-modal="save">Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const input=overlay.querySelector('#editCatLabel');
  input.focus();input.select();
  function doSave(){
    const newLabel=input.value.trim();
    if(!newLabel){toast('Kategori adı girin','error');return;}
    cat.label=newLabel;
    saveDB();
    if(overlay.parentNode)document.body.removeChild(overlay);
    render();toast('Kategori güncellendi','success');
  }
  overlay.addEventListener('click',e=>{
    if(e.target===overlay||e.target.dataset.modal==='cancel'){
      if(overlay.parentNode)document.body.removeChild(overlay);
    }else if(e.target.dataset.modal==='save')doSave();
  });
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSave();}});
}

function toggleCategory(key){
  const cat=findCategory(key);
  if(!cat)return;
  cat.archived=!cat.archived;
  saveDB();render();
  toast(cat.archived?'Kategori arşivlendi':'Kategori geri açıldı','success');
}

function deleteCategory(key){
  const cat=findCategory(key);
  if(!cat)return;
  const recCount=DB.records.filter(r=>r.category===key).length;
  const msg=recCount>0
    ?`"${cat.label}" silinsin mi?\n\n${recCount} kayıt da silinecek.\n\n(İpucu: Kayıtları korumak için "Arşivle" kullanın.)`
    :`"${cat.label}" silinsin mi?`;
  showConfirm(msg,()=>{
    DB.categories=DB.categories.filter(c=>c.key!==key);
    DB.records=DB.records.filter(r=>r.category!==key);
    saveDB();render();toast('Kategori silindi','success');
  });
}

/* ==================== KOD İŞLEMLERİ ==================== */
function generateCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do{code='';for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];}
  while(DB.codes.some(c=>c.code===code));
  DB.codes.push({id:uid(),code,active:true,createdAt:Date.now(),boundClassId:null});
  saveDB();render();
}

function toggleCode(id){
  const c=DB.codes.find(x=>x.id===id);
  if(!c)return;
  c.active=!c.active;saveDB();render();
}

function deleteCode(id){
  const c=DB.codes.find(x=>x.id===id);
  if(!c)return;
  showConfirm(`"${c.code}" kodu silinsin mi?`,()=>{
    DB.codes=DB.codes.filter(x=>x.id!==id);
    DB.requests=DB.requests.filter(r=>r.codeId!==id);
    saveDB();render();toast('Kod silindi','success');
  });
}

function unbindCode(id){
  const c=DB.codes.find(x=>x.id===id);
  if(!c)return;
  showConfirm(`"${c.code}" kodunun sınıf bağlantısı kaldırılsın mı?`,()=>{
    c.boundClassId=null;saveDB();render();
    toast('Sınıf bağlantısı kaldırıldı','success');
  });
}

function copyCode(code){
  const done=()=>toast('Kopyalandı: '+code,'success');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(()=>fallbackCopy(code,done));
  }else fallbackCopy(code,done);
}
function fallbackCopy(text,done){
  const t=document.createElement('textarea');
  t.value=text;t.style.position='fixed';t.style.opacity='0';
  document.body.appendChild(t);t.select();
  try{document.execCommand('copy');done();}
  catch(e){toast('Kopyalanamadı: '+text,'error');}
  document.body.removeChild(t);
}

    overlay.querySelectorAll('[data-val]').forEach(b=>{
      const val=parseInt(b.dataset.val,10);
      if(val===selectedValue){
        b.style.opacity='1';b.style.boxShadow='0 0 0 3px rgba(139,92,246,.35)';b.style.transform='scale(1.03)';
      }else{
        b.style.opacity='.45';b.style.boxShadow='none';b.style.transform='none';
      }
    });
  }
  refreshValueButtons();
  const noteInput=overlay.querySelector('#editRecNote');
  setTimeout(()=>noteInput.focus(),50);
  function doSave(){
    r.value=selectedValue;
    r.note=noteInput.value.trim().slice(0,NOTE_MAX);
    r.adminEdited=true;
    saveDB();
    if(overlay.parentNode)document.body.removeChild(overlay);
    render();toast('Kayıt güncellendi','success');
  }
  overlay.addEventListener('click',e=>{
    if(e.target===overlay||e.target.dataset.modal==='cancel'){
      if(overlay.parentNode)document.body.removeChild(overlay);
      return;
    }
    const valBtn=e.target.closest('[data-val]');
    if(valBtn){selectedValue=parseInt(valBtn.dataset.val,10);refreshValueButtons();}
    else if(e.target.dataset.modal==='save')doSave();
  });
  noteInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();doSave();}
  });
}

function adminDeleteRecord(id){
  const r=DB.records.find(x=>x.id===id);
  if(!r)return;
  const cls=DB.classes.find(c=>c.id===r.classId);
  const stu=cls?cls.students.find(s=>s.id===r.studentId):null;
  const cat=findCategory(r.category);
  const notePart=r.note?`\nAçıklama: "${r.note}"`:'';
  const msg=`Bu kayıt silinsin mi?\n\nÖğrenci: ${stu?stu.name:'Silinmiş'}\nKategori: ${cat?cat.label:r.category}\nDeğer: ${fmtNum(r.value)}${notePart}`;
  showConfirm(msg,()=>{
    DB.records=DB.records.filter(x=>x.id!==id);
    saveDB();render();toast('Kayıt silindi','success');
  });
}

/* ==================== KAYIT EKLEME (ÖĞRENCİ) ==================== */
function saveRecord(studentId,category,value,note){
  const date=today();
  const req=getCurrentRequest();
  if(!req||req.status!=='approved'){toast('Onaylı talebiniz yok','error');return;}
  const allowed=getAllowedCategoriesForRequest(req);
  if(allowed&&!allowed.includes(category)){toast('Bu kategori için yetkiniz yok','error');return;}
  const cat=findCategory(category);
  if(!cat||cat.archived){toast('Kategori artık aktif değil','error');return;}
  const existing=DB.records.find(r=>r.classId===state.student.classId&&r.studentId===studentId&&r.category===category&&r.date===date);
  if(existing){toast('Bugün için zaten kayıt girilmiş','info');return;}
  DB.records.push({
    id:uid(),classId:state.student.classId,studentId,category,value,
    note:note||'',date,adminEdited:false,codeUsed:state.student.code,createdAt:Date.now()
  });
  saveDB();render();
  toast((value>0?'+1':'−1')+' kaydedildi'+(note?' (açıklamalı)':''),value>0?'success':'error');
}

/* ==================== BAŞLAT ==================== */
render();
initSupabase();
</script>
